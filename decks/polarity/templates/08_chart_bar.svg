<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="polarity-master" data-pptx-master-name="Polarity Mono" data-pptx-layout="chart_linear" data-pptx-layout-name="Chart (Linear)">
  <!-- Polarity Mono — 08 Bar chart — sample data; regenerated with real data at deck generation -->
  <rect id="master-bg" width="1280" height="720" fill="#fafafa" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 108 700 58">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="154" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="42" letter-spacing="-1.3" fill="#171717">{{TITLE}}</text>
  </g>

  <g id="chart-legend">
    <rect x="880" y="138" width="12" height="12" rx="3" fill="#171717"/>
    <text x="902" y="150" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">{{LEGEND_PEAK}}</text>
    <rect x="1040" y="138" width="12" height="12" rx="3" fill="#ebebeb"/>
    <text x="1062" y="150" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">{{LEGEND_OTHERS}}</text>
  </g>

  <!-- chart-plot-area: 160,250,1208,540 -->
  <g id="chart-body">
    <g id="chart-grid" stroke="#ebebeb" stroke-width="1">
      <line x1="160" y1="250" x2="1208" y2="250"/>
      <line x1="160" y1="322" x2="1208" y2="322"/>
      <line x1="160" y1="395" x2="1208" y2="395"/>
      <line x1="160" y1="467" x2="1208" y2="467"/>
      <line x1="160" y1="540" x2="1208" y2="540"/>
    </g>

    <g id="chart-y-axis" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">
      <text x="146" y="256">100</text>
      <text x="146" y="328">75</text>
      <text x="146" y="401">50</text>
      <text x="146" y="473">25</text>
      <text x="146" y="546">0</text>
    </g>

    <g id="chart-bars">
      <rect x="160" y="418" width="118" height="122" rx="6" fill="#ebebeb"/>
      <rect x="346" y="380" width="118" height="160" rx="6" fill="#ebebeb"/>
      <rect x="532" y="357" width="118" height="183" rx="6" fill="#ebebeb"/>
      <rect x="718" y="285" width="118" height="255" rx="6" fill="#171717"/>
      <rect x="904" y="334" width="118" height="206" rx="6" fill="#ebebeb"/>
      <rect x="1090" y="311" width="118" height="229" rx="6" fill="#ebebeb"/>
    </g>

    <g id="chart-values" text-anchor="middle" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">
      <text x="219" y="404">42</text>
      <text x="405" y="366">55</text>
      <text x="591" y="343">63</text>
      <text x="777" y="271" fill="#171717">88</text>
      <text x="963" y="320">71</text>
      <text x="1149" y="297">79</text>
    </g>

    <g id="chart-x-axis" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">
      <text x="219" y="572">01</text>
      <text x="405" y="572">02</text>
      <text x="591" y="572">03</text>
      <text x="777" y="572">04</text>
      <text x="963" y="572">05</text>
      <text x="1149" y="572">06</text>
    </g>
  </g>

  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{PAGE_LABEL}}</text>
  </g>
</svg>
