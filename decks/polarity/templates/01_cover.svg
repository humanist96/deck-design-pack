<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="polarity-master" data-pptx-master-name="Polarity Mono" data-pptx-layout="01_cover" data-pptx-layout-name="Cover">
  <!-- Polarity Mono — 01 Cover (single mesh-gradient object, light canvas) -->
  <defs>
    <linearGradient id="meshA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007cf0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="meshB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="meshC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#f9cb28" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="meshFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="0"/>
      <stop offset="72%" stop-color="#fafafa" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#fafafa" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#fafafa" data-pptx-layer="master" data-pptx-editable="false"/>
  <ellipse id="layout-mesh-a" cx="880" cy="120" rx="420" ry="230" fill="url(#meshA)" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="cover-mesh">
    <ellipse cx="1120" cy="230" rx="330" ry="200" fill="url(#meshB)"/>
    <ellipse cx="700" cy="60" rx="300" ry="170" fill="url(#meshC)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#meshFade)"/>
  </g>

  <g id="cover-kicker">
    <text x="72" y="330" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" letter-spacing="1.5" fill="#888888">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 356 1136 106">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="434" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="84" letter-spacing="-3" fill="#171717">{{TITLE}}</text>
  </g>

  <g id="subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="72 480 820 42">
    <text id="subtitle-carrier" data-pptx-placeholder-carrier="true" x="72" y="512" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" letter-spacing="-0.5" fill="#4d4d4d">{{SUBTITLE}}</text>
  </g>

  <g id="cover-pill">
    <rect x="72" y="552" width="188" height="44" rx="100" fill="#171717"/>
    <text x="166" y="580" text-anchor="middle" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#ffffff">{{BRAND_MARK}}</text>
  </g>
  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{PAGE_LABEL}}</text>
  </g>
</svg>
