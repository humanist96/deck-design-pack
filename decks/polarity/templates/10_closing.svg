<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="polarity-master" data-pptx-master-name="Polarity Mono" data-pptx-layout="10_closing" data-pptx-layout-name="Closing (Inverted)">
  <!-- Polarity Mono — 10 Closing -->
  <rect id="master-bg" width="1280" height="720" fill="#fafafa" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-bg-dark" width="1280" height="720" fill="#171717" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 288 1136 88">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="354" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="68" letter-spacing="-2.4" fill="#ffffff">{{BRAND_MARK}}</text>
  </g>

  <g id="closing-copy">
    <line x1="72" y1="398" x2="304" y2="398" stroke="#333333" stroke-width="2"/>
    <text x="72" y="448" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#ffffff">{{CLOSING_LINE}}</text>
    <text x="72" y="490" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#888888">{{CONTACT_LINE}}</text>
  </g>
  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{PAGE_LABEL}}</text>
  </g>
</svg>
