<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="signal-master" data-pptx-master-name="Signal Green" data-pptx-layout="03_section" data-pptx-layout-name="Section (Black)">
  <!-- Signal Green — 03 Section: polarity flip -->
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-bg-black" width="1280" height="720" fill="#000000" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="section-kicker">
    <text x="80" y="336" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#767676">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 360 1120 78">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="418" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="56" letter-spacing="-1.6" fill="#FFFFFF">{{TITLE}}</text>
  </g>

  <g id="section-square">
    <rect x="80" y="462" width="12" height="12" fill="#76B900"/>
  </g>

  <g id="page-foot">
    <text x="80" y="674" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{BRAND_MARK}}</text>
    <text x="1200" y="674" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{PAGE_LABEL}}</text>
  </g>
</svg>
