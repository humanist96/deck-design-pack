<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="signal-master" data-pptx-master-name="Signal Green" data-pptx-layout="07_metrics" data-pptx-layout-name="Metrics">
  <!-- Signal Green — 07 Metrics band (3-up) -->
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="metrics-kicker">
    <text x="80" y="146" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#767676">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 166 1120 56">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="210" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-1.1" fill="#000000">{{TITLE}}</text>
  </g>

  <g id="metrics-lead">
    <text x="80" y="256" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.2" fill="#333333">{{LEAD}}</text>
  </g>

  <g id="metric-1">
    <rect x="80" y="316" width="356" height="248" rx="2" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1"/>
    <rect x="104" y="340" width="12" height="12" fill="#76B900"/>
    <text x="104" y="434" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.4" fill="#76B900">{{METRIC_1_VALUE}}</text>
    <text x="104" y="478" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#333333">{{METRIC_1_LABEL}}</text>
    <text x="104" y="516" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">{{METRIC_1_DELTA}}</text>
  </g>

  <g id="metric-2">
    <rect x="460" y="316" width="356" height="248" rx="2" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1"/>
    <rect x="484" y="340" width="12" height="12" fill="#CCCCCC"/>
    <text x="484" y="434" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.4" fill="#000000">{{METRIC_2_VALUE}}</text>
    <text x="484" y="478" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#333333">{{METRIC_2_LABEL}}</text>
    <text x="484" y="516" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">{{METRIC_2_DELTA}}</text>
  </g>

  <g id="metric-3">
    <rect x="840" y="316" width="356" height="248" rx="2" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1"/>
    <rect x="864" y="340" width="12" height="12" fill="#CCCCCC"/>
    <text x="864" y="434" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="52" letter-spacing="-1.4" fill="#000000">{{METRIC_3_VALUE}}</text>
    <text x="864" y="478" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#333333">{{METRIC_3_LABEL}}</text>
    <text x="864" y="516" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">{{METRIC_3_DELTA}}</text>
  </g>

  <g id="page-foot">
    <text x="80" y="674" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{BRAND_MARK}}</text>
    <text x="1200" y="674" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{PAGE_LABEL}}</text>
  </g>
</svg>
