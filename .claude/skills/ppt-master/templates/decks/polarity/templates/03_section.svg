<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="polarity-master" data-pptx-master-name="Polarity Mono" data-pptx-layout="03_section" data-pptx-layout-name="Section (Inverted)">
  <!-- Polarity Mono — 03 Section: polarity flip marks the chapter -->
  <rect id="master-bg" width="1280" height="720" fill="#fafafa" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-bg-dark" width="1280" height="720" fill="#171717" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="section-kicker">
    <text x="72" y="326" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" letter-spacing="1.5" fill="#888888">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 352 1136 88">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="418" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="68" letter-spacing="-2.4" fill="#ffffff">{{TITLE}}</text>
  </g>

  <g id="section-rule">
    <line x1="72" y1="468" x2="304" y2="468" stroke="#333333" stroke-width="2"/>
  </g>
  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{PAGE_LABEL}}</text>
  </g>
</svg>
