<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="polarity-master" data-pptx-master-name="Polarity Mono" data-pptx-layout="07_metrics" data-pptx-layout-name="Metrics">
  <!-- Polarity Mono — 07 Metrics band (3-up) -->

  <rect id="master-bg" width="1280" height="720" fill="#fafafa" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="metrics-kicker">
    <text x="72" y="146" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" letter-spacing="1.5" fill="#888888">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 164 1136 58">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="210" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="42" letter-spacing="-1.3" fill="#171717">{{TITLE}}</text>
  </g>

  <g id="metrics-lead">
    <text x="72" y="258" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#4d4d4d">{{LEAD}}</text>
  </g>

  <g id="metric-1">
    <rect x="72" y="316" width="356" height="252" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="104" y="428" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-1.8" fill="#171717">{{METRIC_1_VALUE}}</text>
    <text x="104" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#4d4d4d">{{METRIC_1_LABEL}}</text>
    <text x="104" y="512" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">{{METRIC_1_DELTA}}</text>
  </g>

  <g id="metric-2">
    <rect x="460" y="316" width="356" height="252" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="492" y="428" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-1.8" fill="#171717">{{METRIC_2_VALUE}}</text>
    <text x="492" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#4d4d4d">{{METRIC_2_LABEL}}</text>
    <text x="492" y="512" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">{{METRIC_2_DELTA}}</text>
  </g>

  <g id="metric-3">
    <rect x="848" y="316" width="360" height="252" rx="12" fill="#171717"/>
    <text x="880" y="428" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="56" letter-spacing="-1.8" fill="#ffffff">{{METRIC_3_VALUE}}</text>
    <text x="880" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#ffffff">{{METRIC_3_LABEL}}</text>
    <text x="880" y="512" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#888888">{{METRIC_3_DELTA}}</text>
  </g>

  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#888888">{{PAGE_LABEL}}</text>
  </g>
