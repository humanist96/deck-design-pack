<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="signal-master" data-pptx-master-name="Signal Green" data-pptx-layout="04_black_hero" data-pptx-layout-name="Black Hero">
  <!-- Signal Green — 04 Signature: black hero + 12x12 green corner squares -->
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-bg-black" width="1280" height="720" fill="#000000" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="hero-kicker">
    <rect x="80" y="146" width="12" height="12" fill="#76B900"/>
    <text x="108" y="157" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="14" letter-spacing="1.5" fill="#767676">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 196 1120 66">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="248" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="48" letter-spacing="-1.4" fill="#FFFFFF">{{STATEMENT}}</text>
  </g>

  <g id="hero-note">
    <text x="80" y="298" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.2" fill="#767676">{{STATEMENT_NOTE}}</text>
    <text x="80" y="338" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#CCCCCC">{{LEAD}}</text>
  </g>

  <g id="hero-panels">
    <rect x="80" y="396" width="352" height="196" rx="2" fill="#1A1A1A"/>
    <rect x="96" y="412" width="12" height="12" fill="#76B900"/>
    <rect x="96" y="452" width="180" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="96" y="484" width="264" height="8" rx="2" fill="#333333"/>
    <rect x="96" y="512" width="216" height="8" rx="2" fill="#333333"/>
    <rect x="464" y="396" width="352" height="196" rx="2" fill="#1A1A1A"/>
    <rect x="480" y="412" width="12" height="12" fill="#767676"/>
    <rect x="480" y="452" width="148" height="10" rx="2" fill="#CCCCCC"/>
    <rect x="480" y="484" width="240" height="8" rx="2" fill="#333333"/>
    <rect x="480" y="512" width="192" height="8" rx="2" fill="#333333"/>
    <rect x="848" y="396" width="352" height="196" rx="2" fill="#1A1A1A"/>
    <rect x="864" y="412" width="12" height="12" fill="#767676"/>
    <rect x="864" y="452" width="164" height="10" rx="2" fill="#CCCCCC"/>
    <rect x="864" y="484" width="208" height="8" rx="2" fill="#333333"/>
    <rect x="864" y="512" width="256" height="8" rx="2" fill="#333333"/>
  </g>

  <g id="page-foot">
    <text x="80" y="674" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{BRAND_MARK}}</text>
    <text x="1200" y="674" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{PAGE_LABEL}}</text>
  </g>
</svg>
