<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="signal-master" data-pptx-master-name="Signal Green" data-pptx-layout="chart_linear" data-pptx-layout-name="Chart (Linear)">
  <!-- Signal Green — 08 Bar chart — sample data; regenerated with real data at deck generation -->
  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 110 690 56">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="154" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-weight="700" font-size="40" letter-spacing="-1.1" fill="#000000">{{TITLE}}</text>
  </g>

  <g id="chart-legend">
    <rect x="880" y="138" width="12" height="12" rx="2" fill="#76B900"/>
    <text x="902" y="150" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">{{LEGEND_PEAK}}</text>
    <rect x="1040" y="138" width="12" height="12" rx="2" fill="#CCCCCC"/>
    <text x="1062" y="150" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">{{LEGEND_OTHERS}}</text>
  </g>

  <!-- chart-plot-area: 168,250,1200,540 -->
  <g id="chart-body">
    <g id="chart-grid" stroke="#CCCCCC" stroke-width="1">
      <line x1="168" y1="250" x2="1200" y2="250"/>
      <line x1="168" y1="322" x2="1200" y2="322"/>
      <line x1="168" y1="395" x2="1200" y2="395"/>
      <line x1="168" y1="467" x2="1200" y2="467"/>
      <line x1="168" y1="540" x2="1200" y2="540"/>
    </g>

    <g id="chart-y-axis" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">
