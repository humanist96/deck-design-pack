      <text x="154" y="328">75</text>
      <text x="154" y="401">50</text>
      <text x="154" y="473">25</text>
      <text x="154" y="546">0</text>
    </g>

    <g id="chart-bars">
      <rect x="168" y="418" width="116" height="122" rx="2" fill="#CCCCCC"/>
      <rect x="351" y="380" width="116" height="160" rx="2" fill="#CCCCCC"/>
      <rect x="534" y="357" width="116" height="183" rx="2" fill="#CCCCCC"/>
      <rect x="717" y="285" width="116" height="255" rx="2" fill="#76B900"/>
      <rect x="900" y="334" width="116" height="206" rx="2" fill="#CCCCCC"/>
      <rect x="1083" y="311" width="116" height="229" rx="2" fill="#CCCCCC"/>
    </g>

    <g id="chart-values" text-anchor="middle" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">
      <text x="226" y="404">42</text>
      <text x="409" y="366">55</text>
      <text x="592" y="343">63</text>
      <text x="775" y="271" fill="#000000">88</text>
      <text x="958" y="320">71</text>
      <text x="1141" y="297">79</text>
    </g>

    <g id="chart-x-axis" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#767676">
      <text x="226" y="572">01</text>
      <text x="409" y="572">02</text>
      <text x="592" y="572">03</text>
      <text x="775" y="572">04</text>
      <text x="958" y="572">05</text>
      <text x="1141" y="572">06</text>
    </g>
  </g>

  <g id="page-foot">
    <text x="80" y="674" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{BRAND_MARK}}</text>
    <text x="1200" y="674" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#767676">{{PAGE_LABEL}}</text>
  </g>
