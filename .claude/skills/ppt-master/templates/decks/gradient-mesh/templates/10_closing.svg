<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="gmesh-master" data-pptx-master-name="Gradient Mesh Fintech" data-pptx-layout="10_closing" data-pptx-layout-name="Closing (Navy)">
  <!-- Gradient Mesh Fintech — 10 Closing -->
  <rect id="master-bg" width="1280" height="720" fill="#ffffff" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="layout-bg-navy" width="1280" height="720" fill="#1c1e54" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="80 292 1120 80">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="80" y="352" font-family="'Pretendard Light', Pretendard, 'Malgun Gothic', sans-serif" font-size="60" letter-spacing="-1.8" fill="#ffffff">{{BRAND_MARK}}</text>
  </g>

  <g id="closing-copy">
    <rect x="80" y="398" width="96" height="4" rx="2" fill="#533afd"/>
    <text x="80" y="452" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.2" fill="#ffffff">{{CLOSING_LINE}}</text>
    <text x="80" y="494" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" letter-spacing="-0.1" fill="#b9b9f9">{{CONTACT_LINE}}</text>
  </g>

  <g id="page-foot">
    <text x="80" y="674" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#b9b9f9">{{BRAND_MARK}}</text>
    <text x="1200" y="674" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#b9b9f9">{{PAGE_LABEL}}</text>
  </g>
</svg>
