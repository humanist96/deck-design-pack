    <text x="176" y="360" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#d0d6e0">{{ITEM_2_TITLE}}</text>
    <text x="1208" y="360" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#8a8f98">{{ITEM_2_TAG}}</text>
  </g>

  <g id="agenda-item-3">
    <line x1="72" y1="396" x2="1208" y2="396" stroke="#23252a" stroke-width="1"/>
    <text x="72" y="444" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#62666d">{{ITEM_3_NO}}</text>
    <text x="176" y="444" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#d0d6e0">{{ITEM_3_TITLE}}</text>
    <text x="1208" y="444" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#8a8f98">{{ITEM_3_TAG}}</text>
  </g>

  <g id="agenda-item-4">
    <line x1="72" y1="480" x2="1208" y2="480" stroke="#23252a" stroke-width="1"/>
    <text x="72" y="528" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#62666d">{{ITEM_4_NO}}</text>
    <text x="176" y="528" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#d0d6e0">{{ITEM_4_TITLE}}</text>
    <text x="1208" y="528" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#8a8f98">{{ITEM_4_TAG}}</text>
  </g>

  <g id="agenda-item-5">
    <line x1="72" y1="564" x2="1208" y2="564" stroke="#23252a" stroke-width="1"/>
    <text x="72" y="612" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#62666d">{{ITEM_5_NO}}</text>
    <text x="176" y="612" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="22" letter-spacing="-0.3" fill="#d0d6e0">{{ITEM_5_TITLE}}</text>
