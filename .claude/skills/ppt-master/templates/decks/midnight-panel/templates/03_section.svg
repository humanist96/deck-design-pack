<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="midnight-master" data-pptx-master-name="Midnight Panel" data-pptx-layout="03_section" data-pptx-layout-name="Section">
  <!-- Midnight Panel — 03 Section divider -->

  <rect id="master-bg" width="1280" height="720" fill="#010102" data-pptx-layer="master" data-pptx-editable="false"/>

  <g id="section-kicker">
    <text x="72" y="322" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" letter-spacing="1.5" fill="#5e6ad2">{{KICKER}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="72 348 1136 92">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="72" y="416" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="72" letter-spacing="-2.6" fill="#f7f8f8">{{TITLE}}</text>
  </g>

  <g id="section-rule">
    <line x1="72" y1="466" x2="312" y2="466" stroke="#5e6ad2" stroke-width="2"/>
  </g>

  <g id="page-foot">
    <text x="72" y="676" font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#62666d">{{BRAND_MARK}}</text>
    <text x="1208" y="676" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" fill="#62666d">{{PAGE_LABEL}}</text>
  </g>
</svg>
